[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-testes"
version = "1.0.0"
description = "Agente Inteligente de Testes de Software (Pipe-and-Filter, FastAPI, LLM + execução determinística)"
readme = "README.md"
# A especificação prevê Python 3.11+ (imagens Docker usam 3.12); o código mantém compatibilidade com 3.9.
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pyyaml>=6",
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-timeout>=2.2",
]

[project.optional-dependencies]
avaliacao = ["matplotlib>=3.7"]

[project.scripts]
agente-testes = "agente_testes.cli:main"

[tool.setuptools.packages.find]
include = ["agente_testes*"]

[tool.setuptools.package-data]
"agente_testes.avaliacao" = ["corpus/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
